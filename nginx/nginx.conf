# 백엔드 로드밸런서. backend 서비스의 모든 레플리카로 요청을 분산한다.
#   docker compose up --scale backend=N  (기본 레플리카 수는 BACKEND_REPLICAS)

# Docker 내장 DNS. 레플리카가 늘거나 재시작되어 IP 가 바뀌어도 10초 안에 반영한다.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    # WS 는 연결이 오래 유지되므로 라운드로빈보다 연결 수 기준 분산이 고르다.
    least_conn;
    # 응답 실패가 연속되는 인스턴스는 잠시 빼고 나머지로 보낸다 (패시브 헬스체크).
    server backend:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# 백엔드와 같은 요청 ID 로 추적할 수 있게 access 로그에 남긴다.
log_format lb '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
              'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time '
              'rid=$req_id';

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    access_log /dev/stdout lb;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 인스턴스 연결 실패/타임아웃 시 다른 인스턴스로 재시도.
    # POST 등 비멱등 요청은 nginx 기본값대로 재시도하지 않는다 (입찰/결제 중복 방지).
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 1s;

    location / {
        proxy_pass http://backend;
    }

    # 실시간 입찰 WebSocket - 유휴 연결이 끊기지 않게 타임아웃을 길게.
    location ~ ^/items/\d+/bid$ {
        proxy_pass http://backend;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # 로드밸런서 자체 상태 확인 (백엔드와 무관)
    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }
}
