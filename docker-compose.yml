services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: valuverse
      POSTGRES_PASSWORD: valuverse
      POSTGRES_DB: valuverse
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuverse"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    # 앱 내부에서만 사용 (호스트 노출 안 함)

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://valuverse:valuverse@db:5432/valuverse
      AUTO_CREATE_TABLES: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db_data:
