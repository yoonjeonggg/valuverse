services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: valuverse
      POSTGRES_PASSWORD: valuverse
      POSTGRES_DB: valuverse
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuverse"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    # 앱 내부에서만 사용 (호스트 노출 안 함). 백엔드 인스턴스 간 WS 브로드캐스트 전달용.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 스키마 이관은 한 번만 실행한다. 레플리카마다 동시에 돌리면 서로 충돌한다.
  migrate:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://valuverse:valuverse@db:5432/valuverse
      AUTO_CREATE_TABLES: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      REDIS_URL: redis://redis:6379/0
      WS_BROADCAST_BACKEND: redis
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *backend-env
    # 마이그레이션은 migrate 서비스가 끝냈으므로 서버만 띄운다.
    # --proxy-headers: 로그에 nginx 가 아닌 실제 클라이언트 IP 를 남긴다 (내부망에서만 접근 가능).
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # 호스트 포트는 열지 않는다. 외부 요청은 모두 lb 를 거친다.

  lb:
    image: nginx:1.28-alpine
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BACKEND_PORT:-8000}:80"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # 브라우저는 로드밸런서(lb)로 접속한다.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      - lb
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db_data:
